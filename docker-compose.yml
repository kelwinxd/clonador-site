# Serviços locais do projeto. Subir com: docker compose up -d
services:
  # Redis para a fila (BullMQ) da Etapa 6.
  redis:
    image: redis:7-alpine
    container_name: clonador-redis
    # Volta sozinho quando o Docker Desktop reabre, para o backend não achar a porta fechada.
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Postgres para o banco (Etapa 10). Porta 5433 no host para não bater com outro Postgres.
  postgres:
    image: postgres:16-alpine
    container_name: clonador-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: clonador
      POSTGRES_PASSWORD: clonador
      POSTGRES_DB: clonador
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clonador']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres-data:
