# Redis para a fila (BullMQ) da Etapa 6.
# Subir com: docker compose up -d
services:
  redis:
    image: redis:7-alpine
    container_name: clonador-redis
    # Volta sozinho quando o Docker Desktop reabre, para o backend não achar a porta fechada.
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
